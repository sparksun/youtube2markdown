services:
  youtube2markdown:
    build:
      context: .
      args:
        PYTORCH_VERSION: "25.11-py3" # 按需修改版本
        WHISPER_MODEL: "small" # 可改为 small/large 等
    image: youtube2markdown:latest
    # ── GPU 直通 ──────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    # ── 环境变量（从 .env 读取 API Key）──────────────────────────
    env_file:
      - .env
    # ── 挂载本地目录 ─────────────────────────────────────────────
    volumes:
      - ./input:/app/input # 放入本地媒体文件
      - ./output:/app/output # 输出 Markdown 文件
    # ── 默认命令（可被 docker compose run 覆盖）──────────────────
    command: [ "--help" ]
